# ----------------------------------------------------------------------
# Render Infrastructure Blueprint (render.yaml)
# Corporate Consulting Platform
# Full-Stack Deployment: FastAPI Backend + React/Vite Frontend
# ----------------------------------------------------------------------

services:
  # --------------------------------------------------------------------
  # 1. Backend Web Service (FastAPI + Python 3.11+)
  # --------------------------------------------------------------------
  - type: web
    name: consulting-backend
    runtime: python
    region: oregon # Alternatives: frankfurt, ohio, singapore
    plan: starter # Set to 'free' if deploying without persistent disk
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    # Persistent Disk ensures uploaded videos and PDFs survive redeploys & restarts
    # (Note: Disks require Starter plan or above. Comment out disk block for Free tier)
    disk:
      name: uploads-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false # Set your MongoDB Atlas URI in the Render Dashboard
      - key: DB_NAME
        value: consulting_db
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: /var/data/uploads

  # --------------------------------------------------------------------
  # 2. Frontend Static Site (React 19 + Vite 6 + Framer Motion)
  # In Render Blueprints, static sites use: type: web + runtime: static
  # --------------------------------------------------------------------
  - type: web
    name: consulting-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA rewrite rule so client-side routes (/admin, /) route to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: REACT_APP_BACKEND_URL
        value: https://consulting-backend.onrender.com
